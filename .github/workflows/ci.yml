name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Frontend, Go, and capture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
          npm install --global yarn@1.22.22
          python -m pip install requests
      - name: Build frontend and test chain exports
        working-directory: ./web
        run: |
          yarn install --frozen-lockfile
          yarn build
          npm run test:chains
          yarn run eslint .
          yarn prettier --check .
      - name: Build and test backend
        run: |
          go build -o /tmp/pkappa2 ./cmd/pkappa2
          go test ./...
      - name: Test capture agent
        run: python3 -m unittest discover -s capture/tests -v
      - name: Check shell scripts
        run: bash -n scripts/setup.sh scripts/capture.sh scripts/capturectl.sh scripts/capture5001.sh

  docker:
    name: Deploy and capture on a fresh Linux host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start both containers
        run: bash scripts/setup.sh
      - name: Verify adding a service and capturing traffic
        run: python3 scripts/smoke-test.py
      - name: Show deployment logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop CI deployment
        if: always()
        run: docker compose down -v
